; ============================================================
;  FIND MY BOOK - Smart Library System (combined project)
;  ESP32-S3 + ILI9341 touch kiosk + 2x MFRC522 + shelf sensors
; ============================================================
;  Build:   PlatformIO "Build" (checkmark icon)
;  Simulate: F1 -> "Wokwi: Start Simulator"  (needs the Wokwi for VS Code extension)
; ============================================================

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ILI9341@^1.6.1
    adafruit/Adafruit FT6206 Library@^1.1.0
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit NeoPixel@^1.12.3
    adafruit/Adafruit BusIO@^1.16.1
    miguelbalboa/MFRC522@^1.4.11
